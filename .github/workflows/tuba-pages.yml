name: Tuba Project Page

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - name: Install Linux graphics runtime
        run: sudo apt-get update && sudo apt-get install -y libglu1-mesa libxft2 libgomp1
      - run: uv sync --group docs --locked
      - run: npm ci
        working-directory: viewer
      - run: uv run python scripts/build_pages.py pages --output _site
      - run: npx playwright install --with-deps chromium
        working-directory: viewer
      - run: npm run e2e -- pages-catalog --site-root ../_site
        working-directory: viewer
        env:
          TUBA_PAGES_SITE_ROOT: ../_site
      - run: npm run e2e:pages
        working-directory: viewer
        env:
          TUBA_PAGES_SITE_ROOT: ../_site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
