name: Tuba Project Page

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - name: Build Tuba viewer
        working-directory: viewer
        run: |
          npm ci
          npm run build
      - name: Assemble site artifact
        run: |
          mkdir -p _site/notebooks
          cp -R docs/site/. _site/
          # The docs iframes (?bundle=code-aster-review / imported_component_mixed_demo)
          # are served from _site/viewer/<bundle>/. Those bundles live in
          # viewer/public/<bundle>/ and Vite copies public/ into dist/ during
          # `npm run build`, so copying dist here ships them automatically.
          # Local preview of the embeds: `cd viewer && npm run build`, then copy
          # viewer/dist to docs/site/viewer/ before serving docs/site.
          cp -R viewer/dist _site/viewer
          cp notebooks/10_interactive_postprocessor.ipynb _site/notebooks/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
