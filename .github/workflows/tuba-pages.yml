name: Tuba Project Page

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: Re-record the Pages screenshot baselines on this runner and upload them
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - name: Install Linux graphics runtime
        run: sudo apt-get update && sudo apt-get install -y libglu1-mesa libxft2 libgomp1
      - run: uv sync --group docs --extra code-aster-rmed --locked
      - run: npm ci
        working-directory: viewer
      # build_pages.py photographs every gallery card with Playwright, so the
      # browser has to exist before the build, not just before the e2e steps.
      - run: npx playwright install --with-deps chromium
        working-directory: viewer
      - run: uv run python scripts/build_pages.py pages --output _site
      - run: npm run e2e -- pages-catalog --site-root ../_site
        working-directory: viewer
        env:
          TUBA_PAGES_SITE_ROOT: ../_site
      - run: npm run e2e -- pages-gallery --site-root ../_site
        working-directory: viewer
        env:
          TUBA_PAGES_SITE_ROOT: ../_site
      - run: npm run e2e:pages ${{ inputs.update_snapshots && '-- --update-snapshots' || '' }}
        working-directory: viewer
        env:
          TUBA_PAGES_SITE_ROOT: ../_site
      # The visual baselines are only correct when they were rendered here: a
      # container's software GL differs from this runner's by a few percent,
      # which is far more than the tolerance the check allows. Re-recording is
      # a maintenance run, so the images are published rather than committed by
      # the workflow - download them and commit them.
      - if: ${{ inputs.update_snapshots }}
        uses: actions/upload-artifact@v4
        with:
          name: pages-snapshots-linux
          path: viewer/e2e/snapshots/pages-artifact.spec.js/linux
          if-no-files-found: error
      # Create the Pages site on the first run so no manual repository setting
      # is required; the workflow already holds the pages: write permission.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
