name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --all-extras --locked
      - run: uv run python -m pytest

  notebooks-and-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --extra course --locked
      - run: uv run python scripts/check_notebooks.py

  viewer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viewer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - run: uv sync --all-extras --locked
      - run: npm ci
        working-directory: viewer
      - run: npm test
        working-directory: viewer
      - run: uv run python scripts/prepare_release.py
      - run: uv build --no-sources
      - run: uvx twine check dist/*
      - run: uv run python scripts/verify_release_wheel.py dist

  code-aster-integration:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: [self-hosted, code-aster]
    env:
      TUBA_RUN_CODE_ASTER_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --extra dev --locked
      - run: uv run python -m tuba.solver.code_aster_doctor --check
      - run: uv run python -m pytest tests/test_code_aster_real_smoke.py
