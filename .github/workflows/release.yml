name: Beta Candidate

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Source release tag matching the package version (for example v4.0.1)
        required: true
        type: string

permissions: {}

jobs:
  approved-ref:
    if: ${{ github.repository == 'jgwagenfeld/Tuba_v4' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.approve.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: approve
        run: python3 scripts/check_workflow_revision.py
        env:
          GH_TOKEN: ${{ github.token }}
          TUBA_APPROVED_ENVIRONMENTS: code-aster release
      - name: Validate requested tag before the privileged runner is scheduled
        env:
          TAG: ${{ inputs.tag }}
        run: python3 scripts/check_release_tag.py tag "$TAG"

  build:
    needs: [approved-ref, code-aster-integration]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.approved-ref.outputs.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - name: Install Linux graphics runtime
        run: sudo apt-get update && sudo apt-get install -y libglu1-mesa xvfb
      - run: uv sync --all-extras --locked
      - run: npm ci
        working-directory: viewer
      - run: npm test
        working-directory: viewer
      - run: uv run python scripts/prepare_release.py
      - run: xvfb-run -a uv run python -m pytest
      - run: xvfb-run -a uv run python scripts/check_notebooks.py
      - run: uv build --no-sources
      - run: uvx twine check dist/*
      - run: uv run python scripts/verify_release_wheel.py dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: distributions-${{ needs.approved-ref.outputs.sha }}
          path: dist/
          if-no-files-found: error

  code-aster-integration:
    needs: approved-ref
    if: ${{ github.ref == 'refs/heads/main' && needs.approved-ref.outputs.sha == github.sha }}
    runs-on: [self-hosted, code-aster]
    environment: code-aster
    permissions:
      contents: read
    env:
      TUBA_RUN_CODE_ASTER_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.approved-ref.outputs.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - run: uv sync --group docs --extra dev --extra code-aster-rmed --extra ifc --locked
      - run: npm ci
        working-directory: viewer
      - run: npx playwright install chromium
        working-directory: viewer
      - run: uv run python -m tuba.solver.code_aster_doctor --check
      - run: uv run python scripts/check_code_aster_references.py
      - name: Upload numerical qualification report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: code-aster-reference-results
          path: .build/qualification/code-aster-references.xml
          if-no-files-found: warn
      - run: uv run python scripts/refresh_code_aster_gallery.py --all
      - run: uv run python scripts/build_pages.py pages --output .build/code-aster-pages

  tag:
    needs: [approved-ref, build]
    if: ${{ github.ref == 'refs/heads/main' && needs.approved-ref.outputs.sha == github.sha }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Create immutable source tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ needs.approved-ref.outputs.sha }}
        # POST fails if the ref exists; no force-update and no stored Git credentials.
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$SOURCE_SHA"
