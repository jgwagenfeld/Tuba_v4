name: Beta Candidate

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Source release tag matching the package version (for example v4.0.0)
        required: true
        type: string

jobs:
  build:
    needs: code-aster-integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - run: uv sync --all-extras --locked
      - run: uv run python scripts/check_release_tag.py tag "${{ inputs.tag }}"
      - run: npm ci
        working-directory: viewer
      - run: npm test
        working-directory: viewer
      - run: uv run python scripts/prepare_release.py
      - run: uv run python -m pytest
      - run: uv run python scripts/check_notebooks.py
      - run: uv build --no-sources
      - run: uvx twine check dist/*
      - run: uv run python scripts/verify_release_wheel.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  code-aster-integration:
    runs-on: [self-hosted, code-aster]
    env:
      TUBA_RUN_CODE_ASTER_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --extra dev --locked
      - run: uv run python -m tuba.solver.code_aster_doctor --check
      - run: uv run python -m pytest tests/test_code_aster_real_smoke.py

  tag:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create immutable source tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          git fetch --tags
          if git rev-parse --verify --quiet "refs/tags/$TAG"; then
            echo "Tag already exists: $TAG" >&2
            exit 1
          fi
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "$TAG"
