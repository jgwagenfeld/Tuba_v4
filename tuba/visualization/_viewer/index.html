<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tuba Viewer</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <script type="module" crossorigin src="./assets/index-B9ZHI0lU.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DDGnUKCz.css">
  </head>
  <body>
    <!-- The landing gallery. Rendered instead of the review shell when no
         specific review was asked for; hidden in every other case. -->
    <main class="gallery" data-gallery hidden></main>
    <main class="app-shell" data-embed="false">
      <header class="app-header" data-app-header>
        <div class="app-identity">
          <span class="app-kicker">TUBA / ENGINEERING REVIEW</span>
          <h1 data-scene-title>Scene</h1>
          <!-- Switching review is one control, not a round trip through the
               gallery. The gallery explains the set; this moves within it. -->
          <select class="bundle-picker" data-bundle-picker aria-label="Example scene" hidden></select>
          <div class="meta" data-scene-meta></div>
        </div>
        <div class="header-actions">
          <!-- The status band used to be a full row of its own restating what
               the review tables already hold. One chip carries the two facts
               that are actually status - solved, and anything demanding
               attention - and routes to the task that explains them. -->
          <button type="button" class="status-chip" data-status-chip hidden></button>
          <a class="gallery-back" href="./" data-gallery-link hidden>Gallery</a>
          <a class="report-link" data-report-link>Report</a>
          <div class="runtime-status" data-runtime-status role="status" aria-live="polite">Starting</div>
        </div>
      </header>
      <section class="viewer-workspace" data-viewer-workspace>
          <button
            type="button"
            class="rail-toggle"
            aria-expanded="true"
            aria-label="Hide controls"
            title="Hide controls"
            aria-controls="review-controls"
            data-rail-toggle
          >&#8249;</button>
        <aside id="review-controls" class="cockpit-rail" data-task-rail hidden>
          <div class="rail-head">
            <nav aria-label="Engineering review tasks" data-workflow-tabs></nav>
            <div class="rail-find">
              <input type="search" data-search aria-label="Search objects" placeholder="Find object, material, route" />
              <button type="button" class="find-dismiss" data-find-dismiss hidden aria-label="Close finder">✕</button>
            </div>
          </div>
          <div class="display-strip" data-display-strip>
            <div class="rail-pane" data-bodies-pane>
              <div class="task-panel" data-task-panel>
                <div data-result-tools-home>
                  <!-- Four bands in reading order: what colours the scene, what
                       that colour means, what shape it is drawn in, and where it
                       peaks. Each renders its own heading with the state it is
                       set to, so a band scrolled half off still says what it is
                       doing. -->
                  <section data-result-tools>
                    <div class="result-controls" data-result-controls></div>
                    <div class="result-legend" data-result-legend></div>
                    <div class="result-controls" data-result-shape></div>
                    <div data-hotspot-list></div>
                  </section>
                </div>
                <section data-issue-tools-home>
                  <h2>Issues</h2>
                  <div data-issue-list></div>
                  <section hidden data-diagnostic-list></section>
                </section>
              </div>
              <!-- What is drawn, in two bands. Bodies have extent, so they
                   carry an opacity; overlays are marks on the model, so they
                   carry a scale. Both stay on screen whatever the task is. -->
              <div data-layers-block>
                <div class="strip-heading">
                  <h2>Bodies</h2>
                </div>
                <div class="body-list" data-body-list></div>
                <!-- Supports, the load case and the result vectors. Every row
                     here used to be a checkbox in the layer tree, two clicks
                     down inside the rail-foot popover. -->
                <div data-overlays-block hidden>
                  <div class="strip-heading">
                    <h2>Overlays</h2>
                  </div>
                  <div class="body-list" data-overlay-list></div>
                </div>
              </div>
              <p class="projection-note" data-projection-note></p>
              <section class="section-profile" aria-label="TUYAU section sub-point grid" data-section-profile></section>
              <div class="rail-spacer"></div>
            </div>
            <div class="rail-pane" data-find-pane hidden>
              <div class="find-scope" role="group" aria-label="Group results by" data-find-scope></div>
              <div class="object-list" data-object-list></div>
            </div>
          </div>
          <div class="rail-foot">
            <div class="rail-popover" data-rail-popover hidden>
              <div data-section-box-controls></div>
              <details class="strip-drawer layer-tree">
                <summary>All layers</summary>
                <div data-layer-list></div>
              </details>
              <div class="saved-views-block" data-saved-views></div>
            </div>
            <section class="mesh-check" aria-label="Mesh discretisation check" data-discretisation-check></section>
            <div class="rail-utility" data-rail-utility></div>
          </div>
        </aside>
        <section class="viewport">
          <canvas
            data-canvas
            tabindex="0"
            aria-label="Interactive 3D engineering review viewport"
            aria-describedby="viewport-guidance"
            width="1280"
            height="800"
          ></canvas>
          <div class="camera-controls" role="group" aria-label="Standard camera views" data-camera-controls></div>
          <button class="reset-view" type="button" data-reset-view aria-label="Reset 3D view">Reset view</button>
          <div class="viewport-legend" data-viewport-legend></div>
          <!-- Reference material, not a readout: it answers "what is that mark"
               once, so it is asked for rather than parked over the scene. -->
          <button
            type="button"
            class="legend-toggle"
            aria-expanded="false"
            aria-controls="viewport-key"
            data-body-legend-toggle
            hidden
          >i</button>
          <div id="viewport-key" class="body-legend" aria-label="What each mark in the viewport means" data-body-legend hidden></div>
          <p id="viewport-guidance" class="viewport-guidance" data-viewport-guidance>
            Orbit: drag or arrow keys. Zoom: scroll, or + and -. Select: click. Axes: X, Y, Z keys or the labelled controls. Reset: Home fits the full scene.
          </p>
        </section>
        <aside class="inspector" data-inspector hidden>
          <h2>Selected Evidence</h2>
          <div class="property-actions" data-property-actions></div>
          <div class="property-sections" data-properties></div>
        </aside>
      </section>
    </main>
  </body>
</html>
