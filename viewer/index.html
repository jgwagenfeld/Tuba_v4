<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tuba Viewer</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main>
      <aside class="sidebar">
        <h1 data-scene-title>Scene</h1>
        <div class="meta" data-scene-meta></div>
        <h2>Layers</h2>
        <div data-layer-list></div>
        <h2>Overlays</h2>
        <div data-overlay-list></div>
        <h2>Results</h2>
        <div class="result-controls" data-result-controls></div>
        <div class="result-legend" data-result-legend></div>
        <h2>Hotspots</h2>
        <div data-hotspot-list></div>
        <h2>Diagnostics</h2>
        <div data-diagnostic-list></div>
        <h2>Tree</h2>
        <div data-tree></div>
        <h2>Issues</h2>
        <div data-issue-list></div>
        <h2>Search</h2>
        <input type="search" data-search placeholder="Find object, material, route" />
        <h2>Objects</h2>
        <div data-object-list></div>
      </aside>
      <section class="viewport">
        <header>
          <div>Tuba Viewer</div>
          <div data-status>Starting</div>
        </header>
        <canvas data-canvas width="1280" height="800"></canvas>
      </section>
      <aside class="inspector">
        <h2>Properties</h2>
        <div class="property-actions" data-property-actions></div>
        <div class="property-sections" data-properties>Select an object.</div>
      </aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
