<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tuba Viewer</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main class="app-shell" data-embed="false">
      <header class="app-header" data-app-header>
        <div>
          <strong>Tuba Engineering Review</strong>
          <span data-scene-title>Scene</span>
        </div>
        <div class="meta" data-scene-meta></div>
        <div data-status>Starting</div>
      </header>
      <nav class="workflow-tabs" role="tablist" aria-label="Engineering review" data-workflow-tabs></nav>
      <section id="engineering-workflow-panel" class="workflow-panel" role="tabpanel" tabindex="0" data-workflow-panel></section>
      <section id="engineering-3d-panel" class="viewer-workspace" role="tabpanel" aria-labelledby="workflow-tab-3d" tabindex="0" data-viewer-workspace hidden>
        <aside class="sidebar" data-scene-tools>
          <section>
            <h2>Layers</h2>
            <div data-layer-list></div>
          </section>
          <section>
            <h2>Overlays</h2>
            <div data-overlay-list></div>
          </section>
          <div data-result-tools-home>
            <section data-result-tools>
              <h2>Results</h2>
              <div class="result-controls" data-result-controls></div>
              <div class="result-legend" data-result-legend></div>
              <h2>Hotspots</h2>
              <div data-hotspot-list></div>
            </section>
          </div>
          <section>
            <h2>Tree</h2>
            <div data-tree></div>
          </section>
          <section>
            <h2>Issues</h2>
            <div data-issue-list></div>
          </section>
          <section>
            <h2>Search</h2>
            <input type="search" data-search aria-label="Search objects" placeholder="Find object, material, route" />
          </section>
          <section>
            <h2>Objects</h2>
            <div data-object-list></div>
          </section>
        </aside>
        <section class="viewport">
          <canvas data-canvas width="1280" height="800"></canvas>
        </section>
        <aside class="inspector">
          <h2>Properties</h2>
          <div class="property-actions" data-property-actions></div>
          <div class="property-sections" data-properties>Select an object.</div>
        </aside>
      </section>
      <section hidden data-diagnostic-list></section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
