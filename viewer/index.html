<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tuba Viewer</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main class="app-shell" data-embed="false">
      <header class="app-header" data-app-header>
        <div class="app-identity">
          <span class="app-kicker">TUBA / ENGINEERING REVIEW</span>
          <strong data-scene-title>Scene</strong>
          <select class="bundle-picker" data-bundle-picker aria-label="Example scene" hidden></select>
        </div>
        <div class="meta" data-scene-meta></div>
        <a class="report-link" data-report-link>Open Report</a>
        <div class="runtime-status" data-status role="status" aria-live="polite">Starting</div>
      </header>
      <section class="cockpit-status" aria-label="Engineering review status" data-cockpit-status></section>
      <section class="viewer-workspace" data-viewer-workspace>
        <aside class="cockpit-rail" data-task-rail>
          <nav aria-label="Engineering review tasks" data-workflow-tabs></nav>
          <div class="task-panel" data-task-panel>
            <div data-model-tools-home>
              <details>
                <summary>Tree</summary>
                <div data-tree></div>
              </details>
              <section>
                <h2>Search</h2>
                <input type="search" data-search aria-label="Search objects" placeholder="Find object, material, route" />
              </section>
              <details>
                <summary>Objects</summary>
                <div data-object-list></div>
              </details>
            </div>
            <div data-result-tools-home>
              <section data-result-tools>
                <h2>Results</h2>
                <div class="result-controls" data-result-controls></div>
                <div class="result-legend" data-result-legend></div>
                <h2>Hotspots</h2>
                <div data-hotspot-list></div>
              </section>
            </div>
            <section data-issue-tools-home>
              <h2>Issues</h2>
              <div data-issue-list></div>
            </section>
          </div>
          <div class="display-strip" data-display-strip>
            <h2>Display</h2>
            <div class="category-switches" data-category-switches></div>
            <details class="layer-tree">
              <summary>All layers</summary>
              <div data-layer-list></div>
            </details>
            <section class="saved-views-block">
              <h2>Saved Views</h2>
              <div data-saved-views></div>
            </section>
          </div>
        </aside>
        <section class="viewport">
          <canvas data-canvas tabindex="0" aria-label="Interactive 3D engineering review viewport" width="1280" height="800"></canvas>
          <button class="reset-view" type="button" data-reset-view aria-label="Reset 3D view">Reset view</button>
          <p class="viewport-guidance" data-viewport-guidance>
            Orbit: drag. Zoom: scroll. Select: click. Axes: choose a standard view. Reset: fit the full scene.
          </p>
        </section>
        <aside class="inspector" data-inspector hidden>
          <h2>Selected Evidence</h2>
          <div class="property-actions" data-property-actions></div>
          <div class="property-sections" data-properties></div>
        </aside>
        <section class="evidence-dock" aria-label="Engineering evidence" data-evidence-dock>
          <button type="button" aria-expanded="false" data-evidence-expand>Expand Evidence</button>
          <nav class="evidence-tabs" role="tablist" aria-label="Evidence views" data-evidence-tabs></nav>
          <div id="engineering-workflow-panel" class="workflow-panel" role="tabpanel" tabindex="0" data-workflow-panel>
            <section hidden data-diagnostic-list></section>
          </div>
        </section>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
