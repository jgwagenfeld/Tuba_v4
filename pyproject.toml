[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tuba"
version = "4.0.0"
description = "Code_Aster-backed piping analysis and result-review library"
readme = "README.md"
requires-python = ">=3.10"
license = "LGPL-3.0-or-later"
license-files = ["LICENSE", "LICENSE.GPL"]
authors = [
    { name = "Jan-Georg Wagenfeld" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.20",
    "jsonschema>=4.0",
    "gmsh>=4.11",
]

[project.scripts]
tuba-viewer = "tuba.visualization.viewer:main"

[project.optional-dependencies]
# PyVista (pulls VTK, ~100 MB) backs the tuba.plotting quick-look/export path
# only; the web-review path (tuba.visualization + viewer/) does not need it.
viz = [
    "meshio>=5.0",
    "pyvista>=0.38",
]
collision = [
    "trimesh>=4.0",
    "python-fcl>=0.7.0.11",
    "scipy>=1.10",
]
mixed = [
    "meshio>=5.0",
]
code-aster-rmed = [
    "h5py>=3.10",
]
ifc = [
    "ifcopenshell>=0.8",
]
notebook-viz = [
    "jupyterlab>=3",
    "nbclient>=0.10",
    "nbformat>=5.10",
    "ipykernel>=6",
    "ipywidgets",
    "pyvista[all]>=0.48",
    "trame>=3",
    "trame-vtk>=2",
    "trame-vuetify>=3",
    "jupyter-server-proxy",
    "meshio>=5.0",
]
course = [
    "jupyterlab>=3",
    "nbclient>=0.10",
    "nbformat>=5.10",
    "ipykernel>=6",
    "ipywidgets",
    "pyvista[all]>=0.48",
    "trame>=3",
    "trame-vtk>=2",
    "trame-vuetify>=3",
    "jupyter-server-proxy",
    "meshio>=5.0",
    "h5py>=3.10",
    "ifcopenshell>=0.8",
    "trimesh>=4.0",
    "scipy>=1.10",
]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.setuptools.packages.find]
where = ["."]
include = ["tuba*"]

[tool.setuptools.package-data]
"tuba.sections" = ["data/*.input", "data/*.output"]
"tuba.visualization" = ["_viewer/*", "_viewer/assets/*"]
